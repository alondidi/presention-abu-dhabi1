<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מצגת אבו דאבי - שלט רחוק</title>
    <style>
        :root {
            --gold: #C5A059;
            --navy: #0A0E17;
            --white: #F8F9FA;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--navy);
            color: var(--white);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: var(--gold);
            margin: 0;
        }

        p {
            opacity: 0.6;
            font-size: 14px;
        }

        .remote-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 80%;
            max-width: 400px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: var(--white);
            padding: 40px;
            border-radius: 20px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background: var(--gold);
            color: var(--navy);
            transform: scale(0.95);
        }

        .status {
            margin-top: 40px;
            font-size: 12px;
            color: #4CAF50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.4;
            }
        }
    </style>
</head>

<body dir="rtl">
    <div class="header">
        <h1>שלט רחוק</h1>
        <p>מצגת אבו דאבי</p>
    </div>

    <div class="remote-grid">
        <button class="btn" id="nextBtn">הבא ⮕</button>
        <button class="btn" id="prevBtn">⬅ הקודם</button>
    </div>

    <!-- Accessibility Controls -->
    <div class="a11y-controls-remote">
        <div class="a11y-header-remote">נגישות</div>
        <div class="a11y-row">
            <button class="a11y-btn" id="fontDown" title="Decrease font">A-</button>
            <button class="a11y-btn" id="fontReset" title="Reset font">A</button>
            <button class="a11y-btn" id="fontUp" title="Increase font">A+</button>
        </div>
        <button class="a11y-btn-wide" id="contrastToggle">ניגודיות גבוהה</button>
    </div>

    <div class="status">
        <div class="status-dot"></div>
        מחובר למצגת
    </div>

    <style>
        .a11y-controls-remote {
            margin-top: 30px;
            width: 80%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .a11y-header-remote {
            font-size: 14px;
            color: var(--gold);
            text-align: center;
            opacity: 0.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .a11y-row {
            display: flex;
            gap: 10px;
        }

        .a11y-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .a11y-btn-wide {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .a11y-btn:active,
        .a11y-btn-wide:active {
            background: rgba(197, 160, 89, 0.2);
            border-color: var(--gold);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script>
        const socket = io();
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const fontUp = document.getElementById('fontUp');
        const fontDown = document.getElementById('fontDown');
        const fontReset = document.getElementById('fontReset');
        const contrastToggle = document.getElementById('contrastToggle');

        function sendCommand(cmd) {
            socket.emit('command', cmd);
            if (window.navigator.vibrate) window.navigator.vibrate(40);
        }

        nextBtn.addEventListener('click', () => sendCommand('next'));
        prevBtn.addEventListener('click', () => sendCommand('prev'));
        fontUp.addEventListener('click', () => sendCommand('font-up'));
        fontDown.addEventListener('click', () => sendCommand('font-down'));
        fontReset.addEventListener('click', () => sendCommand('font-reset'));
        contrastToggle.addEventListener('click', () => sendCommand('contrast-toggle'));

        socket.on('connect', () => {
            document.querySelector('.status').style.color = '#4CAF50';
            document.querySelector('.status').innerHTML = '<div class="status-dot"></div> מחובר למצגת';
        });

        socket.on('disconnect', () => {
            document.querySelector('.status').style.color = '#f44336';
            document.querySelector('.status').innerHTML = '<div class="status-dot"></div> נותק הקשר';
        });
    </script>
</body>

</html>
